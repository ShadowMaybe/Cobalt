name: Build Cobalt

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK and NDK
        run: |
          # The runner has Android SDK pre-installed at $ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms dir"
          # Accept licenses and install needed components
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" 2>&1 || {
            # Fallback: try without cmdline-tools
            echo "Trying alternative sdkmanager..."
            which sdkmanager 2>/dev/null && sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"
          }

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-debug
          path: app/build/outputs/apk/debug/*.apk
