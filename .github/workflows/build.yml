name: Cobalt Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  ANDROID_COMPILE_SDK: 35
  ANDROID_MIN_SDK: 24
  ANDROID_TARGET_SDK: 35
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Version Routing Verification
        run: |
          echo "=== Cobalt Routing Policy Verification ==="
          echo "Verifying version normalization and route selection..."

      - name: Build Debug (arm64-v8a)
        run: |
          ./gradlew assembleDebug \
            -Pandroid.injected.build.abi=arm64-v8a \
            --stacktrace

      - name: Build Release (arm64-v8a)
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.build.abi=arm64-v8a \
            --stacktrace

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace || true

      - name: Lint Check
        run: ./gradlew lint --stacktrace || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobalt-debug-arm64
          path: |
            cobalt-app/build/outputs/apk/debug/*.apk
            cobalt-app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cobalt-release-arm64
          path: |
            cobalt-app/build/outputs/apk/release/*.apk
            cobalt-app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload Build Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-report
          path: |
            build/reports/
            */build/reports/
          retention-days: 7

  build-all-abis:
    name: Build All ABIs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug (all ABIs)
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Build Release (all ABIs)
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Upload Universal Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobalt-debug-universal
          path: cobalt-app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cobalt-release-universal
          path: cobalt-app/build/outputs/apk/release/*.apk
          retention-days: 30
